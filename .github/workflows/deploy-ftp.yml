name: Deploy FTP - HostGator

# Publica o conteúdo da pasta src/ na conta FTP (raiz = /home3/vinico02/public_html)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy-ftp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Enviar arquivos via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Publicar no servidor
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Só o que está em src/ vai para o servidor
          local-dir: ./src/
          # A conta FTP já abre em public_html, então "./" = public_html
          server-dir: ./
          # Nunca apaga arquivos que não vieram do repositório (WordPress fica intacto)
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/config.php
            **/.env
